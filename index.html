<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FDFBF7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="제니영어수다" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- KakaoTalk & SNS Safe Link Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="☕ 옆집 제니와 5분 영어 수다" />
  <meta property="og:description" content="회원가입 없이 바로 시작하는 주부 맞춤형 5분 영어 티타임 🌺" />
  <title>☕ 옆집 제니와 5분 영어 수다 | Jenny's 5-Min English Cafe</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: { 50: '#FDFBF7', 100: '#F8F3EA', 200: '#EFE6D5', 300: '#E2D4BC' },
            coral: { 50: '#FFF5F2', 100: '#FFE6DF', 200: '#FFCBBF', 400: '#F58268', 500: '#EE6546', 600: '#D94E2F' },
            sage: { 50: '#F2F7F4', 100: '#E1EDE6', 200: '#C3DCD0', 500: '#5D8A73', 600: '#47705B' },
            honey: { 50: '#FFFBEB', 100: '#FEF3C7', 300: '#FCD34D', 500: '#F59E0B' },
            cocoa: { 700: '#524138', 800: '#3D3028', 900: '#291F1A' }
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
            en: ['"Nunito"', '"Noto Sans KR"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #EFE8DC;
      color: #3D3028;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #F8F3EA; }
    ::-webkit-scrollbar-thumb { background: #D8C7B2; border-radius: 9999px; }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop { animation: popIn 0.3s ease-out forwards; }

    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(238, 101, 70, 0.6); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(238, 101, 70, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(238, 101, 70, 0); }
    }
    .mic-pulse { animation: pulseRing 1.6s infinite; }

    .safe-bottom { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
    .safe-top { padding-top: calc(0.5rem + env(safe-area-inset-top, 0px)); }
    button, input { touch-action: manipulation; }
  </style>
</head>
<body class="flex justify-center items-center">

  <!-- Simple & Clean Mobile-First App Container (No Cropping) -->
  <div class="w-full max-w-[500px] h-screen h-[100dvh] bg-cream-50 flex flex-col justify-between overflow-hidden relative shadow-xl">

    <!-- ==================== TOP SIMPLE HEADER ==================== -->
    <header class="bg-white border-b border-cream-200 px-4 safe-top py-3 shrink-0 flex items-center justify-between z-20 shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-coral-100 border-2 border-coral-400 flex items-center justify-center text-xl shadow-sm">
          👩‍🦰
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-black text-cocoa-900 tracking-tight">옆집 제니와 5분 영어</h1>
            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-coral-100 text-coral-600">티타임</span>
          </div>
          <p id="currentScenarioTitle" class="text-xs font-bold text-coral-600">오늘의 주제: 저녁 메뉴 수다</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="openNotebookModal()" class="flex items-center gap-1 bg-sage-50 text-sage-600 border border-sage-200 px-2.5 py-1.5 rounded-xl font-extrabold text-xs shadow-sm">
          <span>📒</span> 복습
        </button>
        <button onclick="openShareModal()" class="flex items-center gap-1 bg-honey-100 text-cocoa-900 border border-honey-300 px-2.5 py-1.5 rounded-xl font-extrabold text-xs shadow-sm">
          <span>📲</span> 공유
        </button>
      </div>
    </header>

    <!-- ==================== MIDDLE CHAT FEED (Scrollable) ==================== -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
      <!-- Chat items rendered dynamically -->
    </main>

    <!-- ==================== BOTTOM INPUT & CONTROLS ==================== -->
    <footer class="bg-white border-t border-cream-200 px-4 safe-bottom pt-3 pb-3 shrink-0 z-20 shadow-lg">
      <!-- Simple Hint / Pattern Bar -->
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="bg-honey-50 border border-honey-300 px-3 py-1.5 rounded-xl flex items-center gap-2 flex-1">
          <span class="text-xs font-black text-honey-600">💡 핵심패턴:</span>
          <span id="patternTextDisplay" class="font-en text-xs sm:text-sm font-black text-coral-600 truncate">I'm thinking of ~ (~할까 생각 중이야)</span>
        </div>
        <button onclick="toggleHintBox()" class="bg-honey-100 hover:bg-honey-200 text-cocoa-900 border border-honey-300 px-3 py-1.5 rounded-xl font-extrabold text-xs shrink-0 shadow-sm">
          말하기 힌트 💡
        </button>
      </div>

      <!-- Collapsible Hint Box -->
      <div id="hintBox" class="hidden mb-2.5 bg-honey-50 border-2 border-honey-300 rounded-2xl p-3 animate-pop">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-black text-honey-600">✨ 터치하면 바로 입력돼요!</span>
          <button onclick="toggleHintBox()" class="text-xs font-bold text-cocoa-700">✕ 닫기</button>
        </div>
        <div class="grid grid-cols-1 gap-1.5" id="hintOptionsContainer"></div>
      </div>

      <!-- Input & Voice Bar -->
      <div class="flex items-center gap-2">
        <div class="flex-1 relative flex items-center">
          <input 
            type="text" 
            id="userInput" 
            placeholder="한국어를 섞어 편하게 입력해보세요 (예: 파스타 만들까 생각 중)" 
            class="w-full bg-cream-100 border-2 border-cream-200 focus:border-coral-400 focus:bg-white rounded-2xl py-3 pl-3.5 pr-8 text-sm font-medium text-cocoa-900 outline-none transition"
            onkeydown="if(event.key === 'Enter') handleUserSubmit()"
          />
          <button onclick="document.getElementById('userInput').value=''" class="absolute right-3 text-cocoa-700 text-sm">✕</button>
        </div>

        <button onclick="handleUserSubmit()" class="bg-coral-500 hover:bg-coral-600 active:scale-95 text-white px-3.5 py-3 rounded-2xl font-black text-sm shadow transition shrink-0">
          <i class="ph-bold ph-paper-plane-right text-lg"></i>
        </button>

        <button id="micBtn" onclick="toggleVoiceRecording()" class="bg-gradient-to-br from-coral-500 to-coral-600 active:scale-95 text-white w-12 h-12 rounded-2xl font-black flex items-center justify-center shadow transition shrink-0 mic-pulse" title="마이크 음성 입력">
          <i id="micIcon" class="ph-bold ph-microphone text-xl"></i>
        </button>
      </div>
    </footer>
  </div>

  <!-- ==================== MODALS ==================== -->
  <!-- 1. Notebook Modal -->
  <div id="notebookModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl border border-cream-200 animate-pop max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-cream-200">
        <h2 class="text-base font-black text-cocoa-900">📒 내 찜콩 복습 노트</h2>
        <button onclick="closeNotebookModal()" class="w-7 h-7 rounded-full bg-cream-100 flex items-center justify-center text-xs font-bold">✕</button>
      </div>
      <div id="notebookListContainer" class="flex-1 overflow-y-auto py-3 space-y-2"></div>
      <div class="pt-3 border-t border-cream-200 text-right">
        <button onclick="closeNotebookModal()" class="bg-cocoa-800 text-white px-4 py-2 rounded-xl text-xs font-black">확인</button>
      </div>
    </div>
  </div>

  <!-- 2. Share Modal -->
  <div id="shareModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl border border-honey-300 animate-pop">
      <div class="flex items-center justify-between pb-3 border-b border-cream-200 mb-3">
        <h2 class="text-base font-black text-cocoa-900">📲 친구에게 앱 링크 공유</h2>
        <button onclick="closeShareModal()" class="w-7 h-7 rounded-full bg-cream-100 flex items-center justify-center text-xs font-bold">✕</button>
      </div>
      <div class="bg-coral-50 border border-coral-200 p-3 rounded-2xl mb-3">
        <p class="text-xs text-cocoa-800 font-medium mb-2" id="shareMessageText">☕ [옆집 제니와 5분 영어 티타임] 회원가입 없이 바로 수다 떨러 오세요 👇</p>
        <button onclick="copyShareLink()" class="w-full bg-coral-500 text-white font-black py-2.5 rounded-xl text-xs shadow">초대 링크 복사하기 📋</button>
      </div>
      <div class="text-center">
        <button onclick="closeShareModal()" class="w-full bg-cocoa-800 text-white py-2.5 rounded-xl text-xs font-black">닫기</button>
      </div>
    </div>
  </div>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    const scenario = {
      title: "저녁 메뉴 수다",
      patternEn: "I'm thinking of ~ (~할까 생각 중)",
      hints: [
        { text: "I'm thinking of making pasta.", ko: "파스타 만들까 생각 중이야." },
        { text: "I'm thinking of ordering chicken.", ko: "치킨 시킬까 생각 중이야." },
        { text: "I'm thinking of cooking stew.", ko: "찌개 끓일까 생각 중이야." }
      ]
    };

    let chatMessages = [
      {
        sender: 'jenny',
        en: "What a lovely day! What are you thinking of having for dinner tonight?",
        ko: "정말 좋은 날이네요! 오늘 저녁엔 뭐 드실 생각이에요?",
        correction: null
      }
    ];

    let notebookItems = [
      { en: "I'm thinking of making pasta.", ko: "파스타 만들까 생각 중이야." },
      { en: "I'd like a warm latte.", ko: "따뜻한 라떼 주시겠어요?" }
    ];

    window.onload = function() {
      renderChatMessages();
      renderHints();
      renderNotebook();
    };

    function renderHints() {
      const container = document.getElementById('hintOptionsContainer');
      container.innerHTML = scenario.hints.map(h => `
        <button onclick="selectHint('${h.text.replace(/'/g, "\\'")}')" class="bg-white hover:bg-honey-100 border border-honey-200 rounded-xl p-2.5 text-left transition shadow-sm">
          <p class="font-en font-black text-xs sm:text-sm text-coral-600">${h.text}</p>
          <p class="text-[11px] font-bold text-cocoa-700">${h.ko}</p>
        </button>
      `).join('');
    }

    function renderChatMessages() {
      const container = document.getElementById('chatContainer');
      container.innerHTML = chatMessages.map(msg => {
        if (msg.sender === 'jenny') {
          return `
            <div class="flex items-start gap-2.5 animate-pop">
              <div class="w-9 h-9 rounded-2xl bg-coral-100 border-2 border-coral-400 flex items-center justify-center text-lg shrink-0 shadow-sm">
                👩‍🦰
              </div>
              <div class="flex-1 max-w-[85%]">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs font-black text-cocoa-900">옆집 제니</span>
                  <button onclick="speakText('${msg.en.replace(/'/g, "\\'")}')" class="text-xs text-coral-600 bg-coral-50 px-2 py-0.5 rounded-lg font-bold">🔊 듣기</button>
                </div>
                <div class="bg-white border border-cream-200 p-3 rounded-2xl rounded-tl-sm shadow-sm">
                  <p class="font-en text-sm sm:text-base font-black text-cocoa-900 mb-1">${msg.en}</p>
                  <p class="text-xs font-bold text-cocoa-700">${msg.ko}</p>
                </div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="flex items-start justify-end gap-2.5 animate-pop">
              <div class="flex-1 max-w-[85%] flex flex-col items-end">
                <div class="bg-coral-500 text-white p-3 rounded-2xl rounded-tr-sm shadow-sm mb-1 w-full">
                  <p class="font-en text-sm sm:text-base font-black">${msg.en}</p>
                  <p class="text-xs text-coral-100 mt-0.5">${msg.ko}</p>
                </div>
                ${msg.correction ? `
                  <div class="bg-sage-50 border border-sage-200 rounded-xl p-2.5 w-full text-xs">
                    <div class="flex items-center justify-between mb-1">
                      <span class="font-extrabold text-sage-700">✨ 제니의 칭찬 & 원어민 표현</span>
                      <button onclick="saveToNotebook('${msg.correction.better.replace(/'/g, "\\'")}', '${msg.correction.ko.replace(/'/g, "\\'")}')" class="text-[10px] bg-sage-600 text-white px-2 py-0.5 rounded font-bold">찜 📌</button>
                    </div>
                    <p class="font-en font-black text-coral-600 text-xs">추천: ${msg.correction.better}</p>
                  </div>
                ` : ''}
              </div>
              <div class="w-9 h-9 rounded-2xl bg-coral-500 flex items-center justify-center text-sm text-white font-black shrink-0 shadow-sm">
                나
              </div>
            </div>
          `;
        }
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    function handleUserSubmit() {
      const input = document.getElementById('userInput');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';

      chatMessages.push({
        sender: 'user',
        en: val,
        ko: "내가 말한 문장",
        correction: {
          better: val,
          ko: "원어민 표현 추천"
        }
      });
      renderChatMessages();

      setTimeout(() => {
        chatMessages.push({
          sender: 'jenny',
          en: "That sounds delicious! You're doing great with English today.",
          ko: "정말 맛있겠네요! 오늘 영어 실력이 아주 멋진걸요.",
          correction: null
        });
        renderChatMessages();
        speakText("That sounds delicious!");
      }, 800);
    }

    function selectHint(text) {
      document.getElementById('userInput').value = text;
      toggleHintBox();
      handleUserSubmit();
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }

    let recognition = null;
    let isRecording = false;

    function toggleVoiceRecording() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('음성 인식을 지원하지 않는 브라우저입니다. 텍스트로 입력해 주세요!');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.onstart = () => { isRecording = true; };
      recognition.onresult = (event) => {
        document.getElementById('userInput').value = event.results[0][0].transcript;
        handleUserSubmit();
      };
      recognition.onend = () => { isRecording = false; };
      try { recognition.start(); } catch(e) {}
    }

    function toggleHintBox() { document.getElementById('hintBox').classList.toggle('hidden'); }
    function openNotebookModal() { document.getElementById('notebookModal').classList.remove('hidden'); }
    function closeNotebookModal() { document.getElementById('notebookModal').classList.add('hidden'); }
    function openShareModal() { document.getElementById('shareModal').classList.remove('hidden'); }
    function closeShareModal() { document.getElementById('shareModal').classList.add('hidden'); }

    function renderNotebook() {
      const container = document.getElementById('notebookListContainer');
      container.innerHTML = notebookItems.map(item => `
        <div class="bg-sage-50 border border-sage-200 rounded-xl p-2.5 flex items-center justify-between">
          <div>
            <p class="font-en font-black text-xs text-coral-600">${item.en}</p>
            <p class="text-[11px] text-cocoa-700 font-bold">${item.ko}</p>
          </div>
          <button onclick="speakText('${item.en.replace(/'/g, "\\'")}')" class="bg-white text-sage-600 px-2.5 py-1 rounded-lg border border-sage-200 text-xs font-bold">듣기</button>
        </div>
      `).join('');
    }

    function saveToNotebook(en, ko) {
      if (!notebookItems.some(i => i.en === en)) {
        notebookItems.push({ en, ko });
        renderNotebook();
        alert('복습노트에 저장되었습니다! 📒');
      } else {
        alert('이미 저장된 표현이에요!');
      }
    }

    function copyShareLink() {
      const text = document.getElementById('shareMessageText').innerText + "\n" + window.location.href;
      navigator.clipboard.writeText(text).then(() => alert('초대 링크가 복사되었습니다!'));
    }
  </script>
</body>
</html>
