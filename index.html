<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FDFBF7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="제니영어수다" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- KakaoTalk & SNS Safe Link Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="☕ 옆집 제니와 5분 영어 수다" />
  <meta property="og:description" content="주부 맞춤형 주제별 3단계 실전 영어 수다 티타임 🌺" />
  <title>☕ 옆집 제니와 5분 영어 수다 | Jenny's 5-Min English Cafe</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: { 50: '#FDFBF7', 100: '#F8F3EA', 200: '#EFE6D5', 300: '#E2D4BC' },
            coral: { 50: '#FFF5F2', 100: '#FFE6DF', 200: '#FFCBBF', 400: '#F58268', 500: '#EE6546', 600: '#D94E2F' },
            sage: { 50: '#F2F7F4', 100: '#E1EDE6', 200: '#C3DCD0', 500: '#5D8A73', 600: '#47705B' },
            honey: { 50: '#FFFBEB', 100: '#FEF3C7', 300: '#FCD34D', 500: '#F59E0B' },
            cocoa: { 700: '#524138', 800: '#3D3028', 900: '#291F1A' }
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
            en: ['"Nunito"', '"Noto Sans KR"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #EFE8DC;
      color: #3D3028;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #F8F3EA; }
    ::-webkit-scrollbar-thumb { background: #D8C7B2; border-radius: 9999px; }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop { animation: popIn 0.3s ease-out forwards; }

    @keyframes pulseRing {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(238, 101, 70, 0.6); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(238, 101, 70, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(238, 101, 70, 0); }
    }
    .mic-pulse { animation: pulseRing 1.6s infinite; }

    .safe-bottom { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
    .safe-top { padding-top: calc(0.5rem + env(safe-area-inset-top, 0px)); }
    button, input { touch-action: manipulation; }
  </style>
</head>
<body class="flex justify-center items-center">

  <!-- Mobile-First App Container -->
  <div class="w-full max-w-[500px] h-screen h-[100dvh] bg-cream-50 flex flex-col justify-between overflow-hidden relative shadow-xl">

    <!-- ==================== TOP HEADER ==================== -->
    <header class="bg-white border-b border-cream-200 px-4 safe-top py-3 shrink-0 flex items-center justify-between z-20 shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-coral-100 border-2 border-coral-400 flex items-center justify-center text-xl shadow-sm">
          👩‍🦰
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-black text-cocoa-900 tracking-tight">옆집 제니와 5분 영어</h1>
            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-coral-100 text-coral-600">티타임</span>
          </div>
          <p id="currentScenarioName" class="text-xs font-bold text-coral-600">주제 선택하기</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="openTopicModal()" class="flex items-center gap-1 bg-coral-50 text-coral-600 border border-coral-200 px-2.5 py-1.5 rounded-xl font-extrabold text-xs shadow-sm">
          <span>☕</span> 주제변경
        </button>
        <button onclick="openNotebookModal()" class="flex items-center gap-1 bg-sage-50 text-sage-600 border border-sage-200 px-2.5 py-1.5 rounded-xl font-extrabold text-xs shadow-sm">
          <span>📒</span> 복습
        </button>
      </div>
    </header>

    <!-- ==================== MIDDLE CHAT FEED ==================== -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
      <!-- Dynamic chat items -->
    </main>

    <!-- ==================== BOTTOM CONTROLS ==================== -->
    <footer class="bg-white border-t border-cream-200 px-4 safe-bottom pt-3 pb-3 shrink-0 z-20 shadow-lg">
      <!-- Hint Bar -->
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="bg-honey-50 border border-honey-300 px-3 py-1.5 rounded-xl flex items-center gap-2 flex-1 overflow-hidden">
          <span class="text-xs font-black text-honey-600 shrink-0">💡 이번 패턴:</span>
          <span id="patternDisplay" class="font-en text-xs sm:text-sm font-black text-coral-600 truncate">주제를 선택해 주세요!</span>
        </div>
        <button onclick="toggleHintBox()" class="bg-honey-100 hover:bg-honey-200 text-cocoa-900 border border-honey-300 px-3 py-1.5 rounded-xl font-extrabold text-xs shrink-0 shadow-sm">
          말하기 힌트 💡
        </button>
      </div>

      <!-- Collapsible Hint Box -->
      <div id="hintBox" class="hidden mb-2.5 bg-honey-50 border-2 border-honey-300 rounded-2xl p-3 animate-pop">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-xs font-black text-honey-600">✨ 터치하면 바로 대화에 쓰여요!</span>
          <button onclick="toggleHintBox()" class="text-xs font-bold text-cocoa-700">✕ 닫기</button>
        </div>
        <div class="grid grid-cols-1 gap-1.5" id="hintOptionsContainer"></div>
      </div>

      <!-- Input Bar -->
      <div class="flex items-center gap-2">
        <div class="flex-1 relative flex items-center">
          <input 
            type="text" 
            id="userInput" 
            placeholder="한국어를 섞어 편하게 입력해 보세요" 
            class="w-full bg-cream-100 border-2 border-cream-200 focus:border-coral-400 focus:bg-white rounded-2xl py-3 pl-3.5 pr-8 text-sm font-medium text-cocoa-900 outline-none transition"
            onkeydown="if(event.key === 'Enter') handleUserSubmit()"
          />
          <button onclick="document.getElementById('userInput').value=''" class="absolute right-3 text-cocoa-700 text-sm">✕</button>
        </div>

        <button onclick="handleUserSubmit()" class="bg-coral-500 hover:bg-coral-600 active:scale-95 text-white px-3.5 py-3 rounded-2xl font-black text-sm shadow transition shrink-0">
          <i class="ph-bold ph-paper-plane-right text-lg"></i>
        </button>

        <button id="micBtn" onclick="toggleVoiceRecording()" class="bg-gradient-to-br from-coral-500 to-coral-600 active:scale-95 text-white w-12 h-12 rounded-2xl font-black flex items-center justify-center shadow transition shrink-0 mic-pulse" title="음성 입력">
          <i id="micIcon" class="ph-bold ph-microphone text-xl"></i>
        </button>
      </div>
    </footer>
  </div>

  <!-- ==================== MODALS ==================== -->
  <!-- 1. Topic Selection Modal -->
  <div id="topicModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl border border-cream-200 animate-pop">
      <div class="flex items-center justify-between pb-3 border-b border-cream-200 mb-4">
        <h2 class="text-base font-black text-cocoa-900">☕ 오늘의 수다 주제를 골라주세요!</h2>
      </div>
      <div class="space-y-2.5" id="topicListContainer"></div>
    </div>
  </div>

  <!-- 2. Notebook Modal -->
  <div id="notebookModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl border border-cream-200 animate-pop max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-cream-200">
        <h2 class="text-base font-black text-cocoa-900">📒 내 찜콩 복습 노트</h2>
        <button onclick="closeNotebookModal()" class="w-7 h-7 rounded-full bg-cream-100 flex items-center justify-center text-xs font-bold">✕</button>
      </div>
      <div id="notebookListContainer" class="flex-1 overflow-y-auto py-3 space-y-2"></div>
      <div class="pt-3 border-t border-cream-200 text-right">
        <button onclick="closeNotebookModal()" class="bg-cocoa-800 text-white px-4 py-2 rounded-xl text-xs font-black">확인</button>
      </div>
    </div>
  </div>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    // 4가지 멀티 주제 및 각 주제별 3단계 연속 대화 시나리오 정의
    const topics = [
      {
        id: 'dinner',
        title: '저녁 메뉴 수다',
        icon: '🍲',
        desc: '오늘 저녁 뭐 먹을지 고민 나누기',
        pattern: "I'm thinking of ~ (~할까 생각 중)",
        hints: [
          { text: "I'm thinking of making pasta.", ko: "파스타 만들까 생각 중이야." },
          { text: "I'm thinking of ordering chicken.", ko: "치킨 시킬까 생각 중이야." },
          { text: "I'm thinking of cooking stew.", ko: "찌개 끓일까 생각 중이야." }
        ],
        turns: [
          {
            jennyEn: "Hi there! What are you thinking of having for dinner tonight?",
            jennyKo: "반가워요! 오늘 저녁엔 뭐 드실 생각이에요?"
          },
          {
            jennyEn: "Good choice! How long does it usually take to cook that?",
            jennyKo: "좋은 선택이네요! 그거 만드는 데 보통 얼마나 걸려요?"
          },
          {
            jennyEn: "Sounds amazing! Hope your family enjoys it tonight. Have a wonderful evening!",
            jennyKo: "정말 맛있겠어요! 가족들이 오늘 저녁에 아주 좋아하겠네요. 멋진 저녁 보내세요!"
          }
        ]
      },
      {
        id: 'mart',
        title: '마트 장보기',
        icon: '🛒',
        desc: '마트에서 물건 찾기 & 할인 코너 구경',
        pattern: "Where can I find ~ (~는 어디에 있나요?)",
        hints: [
          { text: "Where can I find fresh milk?", ko: "신선한 우유는 어디에 있나요?" },
          { text: "Where can I find organic vegetables?", ko: "유기농 채소는 어디에 있나요?" },
          { text: "Where can I find the discount corner?", ko: "할인 코너는 어디에 있나요?" }
        ],
        turns: [
          {
            jennyEn: "Hello! We need to buy some groceries today. What are you looking for first?",
            jennyKo: "안녕하세요! 오늘 장을 좀 봐야겠어요. 먼저 어떤 걸 찾고 계신가요?"
          },
          {
            jennyEn: "Ah, it's right over there near section B! Do you need anything else?",
            jennyKo: "아, 그건 저기 B구역 근처에 바로 있어요! 혹시 다른 필요한 것도 있으신가요?"
          },
          {
            jennyEn: "Got it! Let's check out quickly before the line gets too long.",
            jennyKo: "알겠어요! 줄이 길어지기 전에 서둘러 계산하러 가요."
          }
        ]
      },
      {
        id: 'school',
        title: '아이 학교 행사',
        icon: '🏫',
        desc: '선생님과 상담 및 학부모 모임 이야기',
        pattern: "I'd like to ask about ~ (~에 대해 여쭤보고 싶어요)",
        hints: [
          { text: "I'd like to ask about the field trip.", ko: "현장학습에 대해 여쭤보고 싶어요." },
          { text: "I'd like to ask about after-school classes.", ko: "방과 후 수업에 대해 여쭤보고 싶어요." },
          { text: "I'd like to ask about the parent meeting.", ko: "학부모 모임에 대해 여쭤보고 싶어요." }
        ],
        turns: [
          {
            jennyEn: "Hello! It's so nice to meet you. What would you like to discuss about school?",
            jennyKo: "안녕하세요! 만나서 반가워요. 학교에 대해 어떤 이야기를 나누고 싶으신가요?"
          },
          {
            jennyEn: "That's a great question. The teacher was very happy with your child's progress!",
            jennyKo: "아주 좋은 질문이네요. 선생님이 아이의 학교 생활을 아주 칭찬하셨어요!"
          },
          {
            jennyEn: "You're doing such a wonderful job raising your child. Keep it up!",
            jennyKo: "아이를 정말 훌륭하게 잘 키우고 계시네요. 응원합니다!"
          }
        ]
      },
      {
        id: 'travel',
        title: '해외여행 공항',
        icon: '✈️',
        desc: '공항 입국 심사 & 수하물 찾기',
        pattern: "I'm here for ~ (~하러 왔습니다)",
        hints: [
          { text: "I'm here for a family vacation.", ko: "가족 휴가차 왔습니다." },
          { text: "I'm here for sightseeing.", ko: "관광하러 왔습니다." },
          { text: "I'm here to visit my friends.", ko: "친구들을 만나러 왔습니다." }
        ],
        turns: [
          {
            jennyEn: "Welcome! What is the purpose of your visit today?",
            jennyKo: "환영합니다! 오늘 방문 목적이 무엇인가요?"
          },
          {
            jennyEn: "How many days are you planning to stay here?",
            jennyKo: "여기서 며칠 동안 머무실 계획인가요?"
          },
          {
            jennyEn: "Everything looks great. Enjoy your trip and have a safe journey!",
            jennyKo: "모든 것이 완벽하네요. 즐거운 여행 되시고 안전한 여정이 되길 바랍니다!"
          }
        ]
      }
    ];

    let currentTopic = null;
    let currentTurnIndex = 0;
    let chatMessages = [];
    let notebookItems = [
      { en: "I'm thinking of making pasta.", ko: "파스타 만들까 생각 중이야." },
      { en: "Where can I find fresh milk?", ko: "신선한 우유는 어디에 있나요?" }
    ];

    window.onload = function() {
      renderTopicModal();
    };

    function renderTopicModal() {
      const container = document.getElementById('topicListContainer');
      container.innerHTML = topics.map(t => `
        <button onclick="selectTopic('${t.id}')" class="w-full bg-cream-50 hover:bg-honey-50 border-2 border-cream-200 hover:border-honey-300 rounded-2xl p-3.5 text-left flex items-center gap-3 transition shadow-sm">
          <span class="text-2xl">${t.icon}</span>
          <div>
            <p class="font-black text-sm text-cocoa-900">${t.title}</p>
            <p class="text-xs text-cocoa-700 font-medium">${t.desc}</p>
          </div>
        </button>
      `).join('');
      document.getElementById('topicModal').classList.remove('hidden');
    }

    function selectTopic(id) {
      currentTopic = topics.find(t => id === t.id);
      currentTurnIndex = 0;
      chatMessages = [
        {
          sender: 'jenny',
          en: currentTopic.turns[0].jennyEn,
          ko: currentTopic.turns[0].jennyKo,
          correction: null
        }
      ];

      document.getElementById('currentScenarioName').innerText = `주제: ${currentTopic.title}`;
      document.getElementById('patternDisplay').innerText = currentTopic.pattern;
      
      renderHints();
      renderChatMessages();
      document.getElementById('topicModal').classList.add('hidden');
      speakText(currentTopic.turns[0].jennyEn);
    }

    function openTopicModal() {
      renderTopicModal();
    }

    function renderHints() {
      if (!currentTopic) return;
      const container = document.getElementById('hintOptionsContainer');
      container.innerHTML = currentTopic.hints.map(h => `
        <button onclick="selectHint('${h.text.replace(/'/g, "\\'")}')" class="bg-white hover:bg-honey-100 border border-honey-200 rounded-xl p-2.5 text-left transition shadow-sm">
          <p class="font-en font-black text-xs sm:text-sm text-coral-600">${h.text}</p>
          <p class="text-[11px] font-bold text-cocoa-700">${h.ko}</p>
        </button>
      `).join('');
    }

    function renderChatMessages() {
      const container = document.getElementById('chatContainer');
      container.innerHTML = chatMessages.map(msg => {
        if (msg.sender === 'jenny') {
          return `
            <div class="flex items-start gap-2.5 animate-pop">
              <div class="w-9 h-9 rounded-2xl bg-coral-100 border-2 border-coral-400 flex items-center justify-center text-lg shrink-0 shadow-sm">👩‍🦰</div>
              <div class="flex-1 max-w-[85%]">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs font-black text-cocoa-900">옆집 제니</span>
                  <button onclick="speakText('${msg.en.replace(/'/g, "\\'")}')" class="text-xs text-coral-600 bg-coral-50 px-2 py-0.5 rounded-lg font-bold">🔊 듣기</button>
                </div>
                <div class="bg-white border border-cream-200 p-3 rounded-2xl rounded-tl-sm shadow-sm">
                  <p class="font-en text-sm sm:text-base font-black text-cocoa-900 mb-1">${msg.en}</p>
                  <p class="text-xs font-bold text-cocoa-700">${msg.ko}</p>
                </div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="flex items-start justify-end gap-2.5 animate-pop">
              <div class="flex-1 max-w-[85%] flex flex-col items-end">
                <div class="bg-coral-500 text-white p-3 rounded-2xl rounded-tr-sm shadow-sm mb-1 w-full">
                  <p class="font-en text-sm sm:text-base font-black">${msg.en}</p>
                  <p class="text-xs text-coral-100 mt-0.5">${msg.ko}</p>
                </div>
                ${msg.correction ? `
                  <div class="bg-sage-50 border border-sage-200 rounded-xl p-2.5 w-full text-xs">
                    <div class="flex items-center justify-between mb-1">
                      <span class="font-extrabold text-sage-700">✨ 제니의 칭찬 & 원어민 표현</span>
                      <button onclick="saveToNotebook('${msg.correction.better.replace(/'/g, "\\'")}', '${msg.correction.ko.replace(/'/g, "\\'")}')" class="text-[10px] bg-sage-600 text-white px-2 py-0.5 rounded font-bold">찜 📌</button>
                    </div>
                    <p class="font-en font-black text-coral-600 text-xs">추천: ${msg.correction.better}</p>
                  </div>
                ` : ''}
              </div>
              <div class="w-9 h-9 rounded-2xl bg-coral-500 flex items-center justify-center text-sm text-white font-black shrink-0 shadow-sm">나</div>
            </div>
          `;
        }
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    function handleUserSubmit() {
      if (!currentTopic) {
        alert('먼저 수다 주제를 선택해 주세요!');
        openTopicModal();
        return;
      }
      const input = document.getElementById('userInput');
      const val = input.value.trim();
      if (!val) return;
      input.value = '';

      // 사용자 답변 추가
      chatMessages.push({
        sender: 'user',
        en: val,
        ko: "내가 말한 문장",
        correction: { better: val, ko: "원어민 추천 표현" }
      });
      renderChatMessages();

      // 대화 턴 진행 (총 3턴 연속 연결)
      currentTurnIndex++;
      setTimeout(() => {
        if (currentTurnIndex < currentTopic.turns.length) {
          const nextTurn = currentTopic.turns[currentTurnIndex];
          chatMessages.push({
            sender: 'jenny',
            en: nextTurn.jennyEn,
            ko: nextTurn.jennyKo,
            correction: null
          });
          renderChatMessages();
          speakText(nextTurn.jennyEn);
        } else {
          // 3턴 완료 시 축하 메시지 및 주제 완료
          chatMessages.push({
            sender: 'jenny',
            en: "🎉 Fantastic! You completed this topic successfully. Let's try another topic!",
            ko: "🎉 훌륭해요! 이번 주제 대화를 완벽하게 끝냈어요. 다른 주제도 도전해 보세요!",
            correction: null
          });
          renderChatMessages();
          speakText("Fantastic! You completed this topic successfully.");
          setTimeout(() => openTopicModal(), 2500);
        }
      }, 800);
    }

    function selectHint(text) {
      document.getElementById('userInput').value = text;
      toggleHintBox();
      handleUserSubmit();
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }

    let recognition = null;
    let isRecording = false;

    function toggleVoiceRecording() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('음성 인식을 지원하지 않는 브라우저입니다. 텍스트로 입력해 주세요!');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.onstart = () => { isRecording = true; };
      recognition.onresult = (event) => {
        document.getElementById('userInput').value = event.results[0][0].transcript;
        handleUserSubmit();
      };
      recognition.onend = () => { isRecording = false; };
      try { recognition.start(); } catch(e) {}
    }

    function toggleHintBox() { document.getElementById('hintBox').classList.toggle('hidden'); }
    function openNotebookModal() { 
      renderNotebook();
      document.getElementById('notebookModal').classList.remove('hidden'); 
    }
    function closeNotebookModal() { document.getElementById('notebookModal').classList.add('hidden'); }

    function renderNotebook() {
      const container = document.getElementById('notebookListContainer');
      container.innerHTML = notebookItems.map(item => `
        <div class="bg-sage-50 border border-sage-200 rounded-xl p-2.5 flex items-center justify-between">
          <div>
            <p class="font-en font-black text-xs text-coral-600">${item.en}</p>
            <p class="text-[11px] text-cocoa-700 font-bold">${item.ko}</p>
          </div>
          <button onclick="speakText('${item.en.replace(/'/g, "\\'")}')" class="bg-white text-sage-600 px-2.5 py-1 rounded-lg border border-sage-200 text-xs font-bold">듣기</button>
        </div>
      `).join('');
    }

    function saveToNotebook(en, ko) {
      if (!notebookItems.some(i => i.en === en)) {
        notebookItems.push({ en, ko });
        alert('복습노트에 저장되었습니다! 📒');
      } else {
        alert('이미 저장된 표현이에요!');
      }
    }
  </script>
</body>
</html>
